name: Déployer sur GitHub Pages

on:
  # À chaque push sur main
  push:
    branches: [main]
  # Permet de lancer le déploiement manuellement depuis l'onglet Actions
  workflow_dispatch:

# Permissions minimales pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader le site (statique)
        uses: actions/upload-pages-artifact@v3
        with:
          # On déploie tout le dépôt (index.html est à la racine)
          path: .

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
